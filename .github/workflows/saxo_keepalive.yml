name: Saxo keepalive

# Fornyer Saxo-tokenet døgnet rundt, så login fra "første-gangs autorisation"
# aldrig udløber (SIM-refresh-token lever ca. 1 time). Handler ikke.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: saxo-token   # deler lås med intet andet; undgår to samtidige refresh
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pynacl
      - name: Forny token
        env:
          SAXO_CLIENT_ID: ${{ secrets.SAXO_CLIENT_ID }}
          SAXO_CLIENT_SECRET: ${{ secrets.SAXO_CLIENT_SECRET }}
          SAXO_REDIRECT_URI: ${{ vars.SAXO_REDIRECT_URI || 'http://localhost:12321/callback' }}
          SAXO_TOKEN_BACKEND: github_secret
          SAXO_TOKENS_JSON: ${{ secrets.SAXO_TOKENS_JSON }}
          GH_PAT_FOR_SECRETS: ${{ secrets.GH_PAT_FOR_SECRETS }}
        run: python -m trading.oauth --keepalive
