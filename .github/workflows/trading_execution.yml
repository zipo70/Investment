name: Saxo-eksekvering (Lag 3)

on:
  # schedule:
  #   - cron: "*/15 7-21 * * 1-5"   # slå til når du selv er tilfreds med testresultaterne
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      - name: Kør eksekveringscyklus (Lag 3)
        env:
          SAXO_CLIENT_ID: ${{ secrets.SAXO_CLIENT_ID }}
          SAXO_CLIENT_SECRET: ${{ secrets.SAXO_CLIENT_SECRET }}
          SAXO_ACCOUNT_KEY: ${{ secrets.SAXO_ACCOUNT_KEY }}
          SAXO_REDIRECT_URI: ${{ vars.SAXO_REDIRECT_URI || 'http://localhost:12321/callback' }}
          SAXO_TOKEN_BACKEND: github_secret
          SAXO_TOKENS_JSON: ${{ secrets.SAXO_TOKENS_JSON }}
          GH_PAT_FOR_SECRETS: ${{ secrets.GH_PAT_FOR_SECRETS }}
          SAXO_DRY_RUN: ${{ vars.SAXO_DRY_RUN || 'true' }}
          SAXO_MAX_ORDER_AMOUNT: ${{ vars.SAXO_MAX_ORDER_AMOUNT || '25000' }}
          SAXO_MAX_ORDERS_PER_DAY: ${{ vars.SAXO_MAX_ORDERS_PER_DAY || '5' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: python -m trading.run_execution_cycle

      - name: Committér opdateret trading.db og evt. kill switch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading/state/trading.db trading/state/KILL_SWITCH 2>/dev/null || true
          git diff --cached --quiet && echo "Ingen ændringer at committe." || \
            git commit -m "trading_execution: opdater tilstand [skip ci]"
          git push
